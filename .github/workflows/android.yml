name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :domain:test :xlsx:test :data:testDebugUnitTest 2>&1 | tee tests.log

      - name: APK optimisé (release signée debug)
        id: apk
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :app:assembleRelease 2>&1 | tee apk.log

      - name: Artefacts GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rida-build-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            **/build/reports/tests/**
          if-no-files-found: ignore

      # Publie le statut, les logs et l'APK sur la branche ci-status
      # (lisible par git fetch, sans accès à l'API GitHub).
      - name: Publier le statut sur la branche ci-status
        if: always()
        run: |
          mkdir -p /tmp/status
          {
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_NUMBER}"
            echo "tests=${{ steps.tests.outcome }}"
            echo "apk=${{ steps.apk.outcome }}"
          } > /tmp/status/STATUS.txt
          [ -f tests.log ] && tail -c 400000 tests.log > /tmp/status/tests.log || true
          [ -f apk.log ] && tail -c 400000 apk.log > /tmp/status/apk.log || true
          for d in $(find . -path '*/build/test-results/*' -name '*.xml' -printf '%h\n' | sort -u); do
            mkdir -p "/tmp/status/test-results/$d"; cp "$d"/*.xml "/tmp/status/test-results/$d/";
          done
          cp app/build/outputs/apk/release/*.apk /tmp/status/ 2>/dev/null || true
          cd /tmp/status
          git init -q -b ci-status
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "CI run ${GITHUB_RUN_NUMBER} for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-status

      - name: Échec si tests ou build en échec
        if: steps.tests.outcome != 'success' || steps.apk.outcome != 'success'
        run: exit 1
